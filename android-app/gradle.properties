# Project-wide Gradle settings.

# Increase Gradle daemon heap for Android builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable AndroidX (required for Material Components and AppCompat).
android.useAndroidX=true

# Gradle daemon stays alive between builds for faster rebuilds.
org.gradle.daemon=true

# Suppress build-time warning when compileSdk 37 is used with build-tools 36.0.0.
# The build is still correct; the warning is cosmetic.
android.suppressUnsupportedCompileSdk=37.0
