[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-sync-desktop-agent"
version = "0.1.0"
description = "Local text clipboard change detector for the Clipboard Sync POC"
requires-python = ">=3.11"
dependencies = [
    "pyperclip>=1.9,<2",
    "requests>=2.32,<3",
]

[project.scripts]
clipboard-agent = "clipboard_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
